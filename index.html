<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 fill=%22%23000080%22/%3E%3Ctext x=%228%22 y=%2212%22 text-anchor=%22middle%22 font-size=%2210%22 font-family=%22serif%22 font-weight=%22bold%22 fill=%22white%22%3EDM%3C/text%3E%3C/svg%3E" />
    <title>Designer Map</title>
  </head>
  <body>
    <div class="desktop">
      <div class="window main-window">
        <div class="title-bar">
          <div class="title-bar-text">Designer Map: Fashion Houses &amp; Creative Directors</div>
          <div class="title-bar-controls" aria-hidden="true">
            <button aria-label="Minimize" tabindex="-1"></button>
            <button aria-label="Maximize" tabindex="-1"></button>
            <button aria-label="Close" tabindex="-1"></button>
          </div>
        </div>

        <div class="window-body">
          <div class="toolbar">
            <div class="field-row">
              <label for="view">View:</label>
              <select id="view">
                <option value="map">World map</option>
                <option value="network">Network (designers ↔ houses)</option>
              </select>
            </div>

            <div class="field-row">
              <label for="search">Find:</label>
              <input id="search" type="text" list="search-options" placeholder="House or designer" />
              <datalist id="search-options"></datalist>
            </div>

            <div class="field-row year-row">
              <label for="year">Year:</label>
              <input id="year" type="range" step="1" />
              <output id="year-label" for="year"></output>
              <button id="play">▶ Play</button>
            </div>

            <div class="field-row">
              <button id="expand-all" aria-pressed="false">Expand all</button>
              <button id="fit">Fit</button>
              <button id="home">Directory</button>
            </div>
          </div>

          <div class="content">
            <div id="graph" class="graph-pane" aria-label="Graph of fashion houses and designers"></div>

            <div class="window side-window">
              <div class="title-bar">
                <div class="title-bar-text" id="panel-title">Directory</div>
              </div>
              <div class="window-body" id="panel"></div>
            </div>
          </div>
        </div>

        <div class="status-bar">
          <p class="status-bar-field" id="status-counts"></p>
          <p class="status-bar-field" id="status-selection">Nothing selected</p>
          <p class="status-bar-field" id="status-year"></p>
        </div>
      </div>

      <div class="taskbar">
        <button class="start-button"><span class="start-logo" aria-hidden="true"></span><b>Start</b></button>
        <button class="task active">Designer Map</button>
        <div class="tray"><span id="clock"></span></div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
